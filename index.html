    <meta charset="UTF-8" />

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0284C7" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="KaniMichi" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[#F8F9FA] text-[#111827] antialiased selection:bg-[#0284C7]/20 selection:text-[#0284C7] dark:bg-[#0F1115] dark:text-[#F3F4F6]">
    <div id="root">
      <div id="km-boot-loader" style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,-apple-system,sans-serif;padding:24px;text-align:center;">
        <div>
          <div style="font-size:22px;font-weight:800;letter-spacing:-0.02em;">KaniMichi</div>
          <p id="km-boot-msg" style="margin-top:8px;font-size:13px;color:#64748b;">Memuat aplikasi...</p>
        </div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function (e) {
        var el = document.getElementById('km-boot-msg');
        if (el) el.textContent = 'Gagal memuat: ' + (e.message || 'Periksa koneksi atau konfigurasi GitHub Pages.');
      });
      window.addEventListener('unhandledrejection', function (e) {
        var el = document.getElementById('km-boot-msg');
        if (el && e.reason) el.textContent = 'Gagal memuat: ' + (e.reason.message || String(e.reason));
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
