name: Build KaniMichi Android APK (HP & Tablet)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Android Platform 36 & Build Tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager" \
            "$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager 2>/dev/null | head -n 1)" \
            "$(command -v sdkmanager 2>/dev/null || true)"; do
            if [ -n "$candidate" ] && [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found under $SDK_ROOT"
            exit 1
          fi
          echo "Using SDK_ROOT=$SDK_ROOT and SDKMANAGER=$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          set +o pipefail
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses > /dev/null 2>&1 || true
          set -o pipefail
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36" "build-tools;36.0.0"

      - name: Prepare permanent Android signing keystore (JKS)
        run: |
          if [ -f android/app/kanimichi-debug.p12.b64 ]; then
            base64 -d android/app/kanimichi-debug.p12.b64 > android/app/kanimichi-debug.p12
          fi
          rm -f android/app/kanimichi-debug.jks
          keytool -importkeystore \
            -srckeystore android/app/kanimichi-debug.p12 \
            -srcstoretype PKCS12 \
            -srcstorepass kanimichi-debug-key \
            -destkeystore android/app/kanimichi-debug.jks \
            -deststoretype JKS \
            -deststorepass kanimichi-debug-key \
            -destkeypass kanimichi-debug-key \
            -noprompt
          keytool -list -keystore android/app/kanimichi-debug.jks -storepass kanimichi-debug-key

      - name: Install npm dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build KaniMichi offline web bundle
        env:
          VITE_BASE_PATH: ./
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Sync web assets & offline JSON banks into Android project
        run: npx cap sync android

      - name: Compile Android APK (Phone & Tablet)
        run: |
          cd android
          chmod +x gradlew
          VERSION_CODE=$((100 + ${{ github.run_number }}))
          VERSION_NAME="1.1.${{ github.run_number }}"
          echo "Building KaniMichi APK versionCode=$VERSION_CODE versionName=$VERSION_NAME"
          ./gradlew assembleDebug \
            -PAPP_VERSION_CODE="$VERSION_CODE" \
            -PAPP_VERSION_NAME="$VERSION_NAME" \
            --no-daemon \
            --stacktrace

      - name: Verify APK signature & prepare downloadable artifact
        run: |
          APK_SRC="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="${ANDROID_HOME}/build-tools/36.0.0/apksigner"
          if [ -x "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_SRC"
          fi
          mkdir -p apk-output
          cp "$APK_SRC" apk-output/KaniMichi-Android-Phone-Tablet.apk

      - name: Upload KaniMichi Android APK
        uses: actions/upload-artifact@v6
        with:
          name: KaniMichi-Android-APK
          path: apk-output/KaniMichi-Android-Phone-Tablet.apk
          retention-days: 90
